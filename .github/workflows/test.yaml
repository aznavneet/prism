name: PRISM CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read
  pull-requests: write

jobs:
  build:

    if: contains(
      github.event.pull_request.labels.*.name,
      'build:run'
      )

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Maven Wrapper
        run: chmod +x mvnw

      - name: Initialize CI Log
        run: |
          touch ci.log
          echo "===== CI PIPELINE START =====" > ci.log

      - name: Build Application
        id: build
        continue-on-error: true
        run: |
          echo "===== MAVEN BUILD =====" >> ci.log
          ./mvnw clean package 2>&1 | tee -a ci.log

      - name: Verify Build Log
        if: always()
        run: |
          pwd
          ls -la
          cat ci.log

      - name: Docker Login
        id: docker_login
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          echo "" >> ci.log
          echo "===== DOCKER LOGIN =====" >> ci.log

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin \
            2>&1 | tee -a ci.log

      - name: Build Docker Image
        id: docker
        continue-on-error: true
        run: |
          echo "" >> ci.log
          echo "===== DOCKER BUILD =====" >> ci.log

          docker build \
            -f Dockerfile \
            -t aznavneet/prism:latest \
            . 2>&1 | tee -a ci.log

      - name: Verify Docker Log
        if: always()
        run: |
          pwd
          ls -la
          cat ci.log

      - name: Push Docker Image
        id: docker_push
        if: steps.docker.outcome == 'success'
        continue-on-error: true
        run: |
          echo "" >> ci.log
          echo "===== DOCKER PUSH =====" >> ci.log

          docker push \
            aznavneet/prism:latest \
            2>&1 | tee -a ci.log

      - name: Install Gemini SDK
        if: always()
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Generate CI RCA
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/failure_analysis.py --type ci --log ci.log

      - name: Publish RCA Summary
        if: always()
        run: |
          echo "## 🚨 PRISM RCA Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat rca_summary.md >> $GITHUB_STEP_SUMMARY

      - name: Verify RCA File
        if: always()
        run: |
          pwd
          ls -la
          cat rca.md

      - name: Run CD / EKS Deployment Diagnostics
        id: cd_deploy
        if: always() && steps.build.outcome == 'success' && steps.docker_push.outcome == 'success'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          EKS_DEPLOYMENT_NAME: ${{ secrets.EKS_DEPLOYMENT_NAME }}
        run: |
          set +e
          echo "" >> ci.log
          echo "===== CD / KUBERNETES LOGS =====" >> ci.log
          echo "Starting read-only CD diagnostics..." >> ci.log

          echo "" >> ci.log
          echo "===== KUBECTL VERSION =====" >> ci.log
          kubectl version --client=true 2>&1 | tee -a ci.log || true

          if [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ] && [ -n "${EKS_CLUSTER_NAME}" ] && [ -n "${AWS_REGION}" ]; then
            echo "" >> ci.log
            echo "===== AWS / EKS AUTH =====" >> ci.log
            aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}" 2>&1 | tee -a ci.log || true
          else
            echo "AWS/EKS configuration not available; skipping deployment access." >> ci.log
          fi

          echo "" >> ci.log
          echo "===== DEPLOYMENTS =====" >> ci.log
          kubectl get deployments -A 2>&1 | tee -a ci.log || true

          echo "" >> ci.log
          echo "===== PODS =====" >> ci.log
          kubectl get pods -A 2>&1 | tee -a ci.log || true

          echo "" >> ci.log
          echo "===== POD DESCRIPTIONS =====" >> ci.log
          for ns in $(kubectl get ns -o name 2>/dev/null | cut -d/ -f2); do
            kubectl describe pods -n "$ns" 2>&1 | tee -a ci.log || true
          done

          echo "" >> ci.log
          echo "===== CONTAINER STATUS =====" >> ci.log
          kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' 2>/dev/null | while read -r ns pod; do
            if [ -n "$ns" ] && [ -n "$pod" ]; then
              kubectl get pod "$pod" -n "$ns" -o json 2>&1 | tee -a ci.log || true
            fi
          done

          echo "" >> ci.log
          echo "===== CONTAINER LOGS =====" >> ci.log
          kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' 2>/dev/null | while read -r ns pod; do
            if [ -n "$ns" ] && [ -n "$pod" ]; then
              kubectl logs -n "$ns" "$pod" --all-containers=true --tail=200 2>&1 | tee -a ci.log || true
            fi
          done

          echo "" >> ci.log
          echo "===== EVENTS =====" >> ci.log
          kubectl get events -A --sort-by='.lastTimestamp' 2>&1 | tee -a ci.log || true

          echo "" >> ci.log
          echo "===== ROLLOUT STATUS =====" >> ci.log
          if [ -n "${EKS_DEPLOYMENT_NAME}" ]; then
            kubectl rollout status deployment/"${EKS_DEPLOYMENT_NAME}" --timeout=180s 2>&1 | tee -a ci.log || true
          else
            echo "No EKS deployment name configured; rollout status skipped." >> ci.log
          fi

          echo "" >> ci.log
          echo "===== CD DIAGNOSTICS COMPLETE =====" >> ci.log

      - name: Generate CD RCA
        if: always() && steps.build.outcome == 'success' && steps.docker_push.outcome == 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/failure_analysis.py --type cd --log ci.log
          echo "" >> ci.log
          echo "===== CD RCA =====" >> ci.log
          cat rca.md >> ci.log

      - name: Upload Final CI Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log

      - name: Rename RCA
        if: always()
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          mv rca.md ci-rca-${SHORT_SHA}.md

      - name: Upload RCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-rca
          path: ci-rca-*.md

      - name: Send RCA Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 PRISM CI Failure Analysis"
          to: prism.bot11@gmail.com
          from: PRISM Bot
          body: |
            AI-generated RCA report attached.
          attachments: ci-rca-*.md

      - name: Fail Pipeline
        if: |
          steps.build.outcome == 'failure' ||
          steps.docker_login.outcome == 'failure' ||
          steps.docker.outcome == 'failure' ||
          steps.docker_push.outcome == 'failure' ||
          steps.cd_deploy.outcome == 'failure'
        run: exit 1